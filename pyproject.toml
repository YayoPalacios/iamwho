[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "iamwho"
version = "0.2.0"
description = "IAM principal analysis: ingress, egress, mutation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Yayo Palacios", email = "yayette95@gmail.com" },
]
keywords = [
    "aws",
    "iam",
    "security",
    "privilege-escalation",
    "blast-radius",
    "cloud-security",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "boto3>=1.34",
    "typer>=0.9",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/YayoPalacios/iamwho"
Repository = "https://github.com/YayoPalacios/iamwho"
Issues = "https://github.com/YayoPalacios/iamwho/issues"

[project.scripts]
iamwho = "iamwho.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/iamwho"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
