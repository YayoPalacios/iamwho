name: IAM Security Audit

# Manual only. This workflow is the usage example from README.md: it audits a
# real AWS account and needs AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY secrets
# plus an IAM_ROLE_ARN variable, none of which are set on this repo. Running it
# on push made every commit red. Copy it into your own repo to use it for real.
on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install iamwho
        run: pip install iamwho

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Analyze IAM Role
        run: iamwho analyze ${{ vars.IAM_ROLE_ARN }} --fail-on high
